// Gradle init script, passed by lucent build with --init-script: registers
// lucentClasspath in the app project, which writes its resolved compile
// classpath (AARs and jars) to .lucent/android-classpath.json, so
// lucent:android/<package> can bind any library the app links (AndroidX,
// Play services, Firebase…). The app's build files are not touched.
gradle.allprojects { project ->
  if (project.path != ":app") return
  // Registered once the Android plugin is applied, this runs after its own
  // afterEvaluate, which creates the variants' configurations.
  project.pluginManager.withPlugin("com.android.application") { project.afterEvaluate {
    def out = new File(project.rootProject.projectDir.parentFile, ".lucent/android-classpath.json")
    def artifactType = Attribute.of("artifactType", String)
    def compileClasspath = project.configurations.findByName("debugCompileClasspath") ?: project.configurations.findByName("releaseCompileClasspath")
    if (compileClasspath == null) return
    def viewOf = { String type -> compileClasspath.incoming.artifactView { lenient(true); attributes.attribute(artifactType, type) }.files }
    def aars = viewOf("aar")
    def jars = viewOf("jar")
    project.tasks.register("lucentClasspath") {
      inputs.files(aars, jars)
      outputs.file(out)
      doLast {
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([aars: aars.files*.absolutePath.sort(), jars: jars.files*.absolutePath.sort()]))
      }
    }
  } }
}
