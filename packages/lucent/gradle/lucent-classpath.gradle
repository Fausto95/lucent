// Registers lucentClasspath in the app project it is applied to: writes the
// app's resolved compile classpath (AARs and jars), its minSdk and its
// compileSdk to .lucent/android-classpath.json, so lucent:android/<package> can bind any
// library the app links (AndroidX, Play services, Firebase…).
// Applied by lucent.gradle (the app's Gradle task) and by
// lucent-classpath.init.gradle (when lucent build asks Gradle). In an app
// with lucent.gradle, lucent build's run applies it twice: once registers.
if (ext.has("lucentClasspathApplied")) return
ext.lucentClasspathApplied = true
pluginManager.withPlugin("com.android.application") {
  // Registered after the Android plugin's own afterEvaluate, which creates the variants' configurations.
  afterEvaluate {
    def out = new File(rootProject.projectDir.parentFile, ".lucent/android-classpath.json")
    def artifactType = Attribute.of("artifactType", String)
    // The app's debug variant's compile classpath, else its release variant's (its
    // debug variants disabled). With product flavors a build type has a variant per
    // flavor (freeDebug, paidDebug): the first by name. The unflavored name comes
    // first: other build types may end like it (benchmarkRelease).
    def variantClasspath = { String buildType ->
      def flavored = "${buildType.capitalize()}CompileClasspath"
      configurations.findByName("${buildType}CompileClasspath")?.name ?: configurations.names.sort().find { it.endsWith(flavored) }
    }
    def compileClasspath = variantClasspath("debug") ?: variantClasspath("release")
    if (compileClasspath == null)
      // Quiet level: lucent build runs Gradle with -q.
      logger.quiet("lucentClasspath: the app has no debug or release variant; lucent:android binds the SDK's and Lucent packages' libraries only")

    // Libraries from repositories only: the app's other projects (autolinked
    // modules, Lucent's own) would have to be built first, and their preBuild
    // runs lucentBuild, which needs this classpath.
    def viewOf = { String type ->
      if (compileClasspath == null) return files()
      configurations.getByName(compileClasspath).incoming.artifactView {
        lenient(true)
        componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        attributes.attribute(artifactType, type)
      }.files
    }
    def aars = viewOf("aar")
    def jars = viewOf("jar")
    // The app's SDK levels: the oldest Android it runs on (APIs newer than it need a check), and
    // the platform it compiles against (what Lucent binds). AGP 7+ names them minSdk and
    // compileSdk; older versions minSdkVersion and compileSdkVersion ("android-34").
    def sdkLevel = { Closure read ->
      try {
        def v = read()
        if (v == null) return null
        def m = (v.toString() =~ /(\d+)/)
        return m.find() ? (m.group(1) as Integer) : null
      } catch (Exception ignored) {
        return null
      }
    }
    def minSdk = sdkLevel { android.defaultConfig.hasProperty("minSdk") ? android.defaultConfig.minSdk : android.defaultConfig.minSdkVersion?.apiLevel }
    def compileSdk = sdkLevel { android.hasProperty("compileSdk") && android.compileSdk != null ? android.compileSdk : android.compileSdkVersion }
    tasks.register("lucentClasspath") {
      inputs.files(aars, jars)
      outputs.file(out)
      doLast {
        out.parentFile.mkdirs()
        def record = [aars: aars.files*.absolutePath.sort(), jars: jars.files*.absolutePath.sort()]
        if (minSdk != null) record.minSdk = minSdk
        if (compileSdk != null) record.compileSdk = compileSdk
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(record))
      }
    }
  }
}
