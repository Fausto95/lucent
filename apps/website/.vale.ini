# Prose rules for the docs (CONTRIBUTING-DOCS.md). scripts/website.ts writes
# each page's prose to .prose/ and runs Vale there with this file.
StylesPath = .vale
MinAlertLevel = error

[*.md]
BasedOnStyles = Lucent

# Architecture › Internals is for contributors, and names the compiler's parts.
[*/docs/architecture/internals/*.md]
Lucent.InternalNames = NO
