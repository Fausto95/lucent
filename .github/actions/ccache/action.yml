name: ccache
description: Compiles through ccache, its cache kept across main's runs under `key` and read by pull requests. On Linux the compilers on the PATH (clang, clang++, g++) become ccache's, so scripts that run them by name use it.
inputs:
  key:
    description: What names this job's cache (its objects differ from other jobs').
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          sudo apt-get install -y ccache
          sudo update-ccache-symlinks
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        else
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ccache
        fi
        {
          echo "CCACHE_DIR=$HOME/.ccache"
          # Bounded: each run's cache is saved whole, and the repository's caches share 10 GB.
          echo "CCACHE_MAXSIZE=400M"
          # Paths under the checkout hash relative to it, so another checkout's objects match.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          # The runner's compilers are reinstalled with each image: their mtimes say nothing.
          echo "CCACHE_COMPILERCHECK=content"
        } >> "$GITHUB_ENV"
    # Saved from main's runs alone, which pull requests read: one per pull request push would
    # evict the others within a few runs. Main's runs are never cancelled (ci.yml's concurrency),
    # so each one that passes saves its objects.
    - name: Compiler cache (objects of main's earlier runs, saved)
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ inputs.key }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ inputs.key }}-
    - name: Compiler cache (objects of main's runs)
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ inputs.key }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ inputs.key }}-
    - shell: bash
      run: ccache --zero-stats >/dev/null
