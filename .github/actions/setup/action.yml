name: Set up the workspace
description: pnpm and Node from .node-version, the locked dependencies, and the built CLI (bin/lucent.cjs runs dist/). On macOS, the Xcode the workflow's XCODE_VERSION names.
runs:
  using: composite
  steps:
    # The runner image's default Xcode moves with each image update; the SDK the tests read
    # (and the schemas the SDK cache keeps) would move with it.
    - name: Xcode ${{ env.XCODE_VERSION }}
      if: runner.os == 'macOS'
      shell: bash
      run: |
        dir="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
        if [[ ! -d "$dir" ]]; then
          echo "::error::Xcode ${XCODE_VERSION} is not on this image; the installed ones:" >&2
          ls -d /Applications/Xcode_*.app >&2
          exit 1
        fi
        echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
        DEVELOPER_DIR="$dir" xcodebuild -version
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm build
      shell: bash
