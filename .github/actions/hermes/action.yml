name: Hermes
description: The Hermes revision HERMES_REF, built into HERMES_DIR (cached), for the harnesses that run Lucent through JSI.
runs:
  using: composite
  steps:
    - name: Restore Hermes build
      id: hermes-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.HERMES_DIR }}
        key: hermes-${{ runner.os }}-${{ env.HERMES_REF }}
    # The Ubuntu image has Ninja and ICU's headers; an apt-get update alone took longer than the
    # rest of this action on a cache hit.
    - name: Build Hermes
      if: steps.hermes-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        command -v ninja >/dev/null && [[ -e /usr/include/unicode/ucol.h ]] ||
          { sudo apt-get update && sudo apt-get install -y ninja-build libicu-dev; }
        git init "$HERMES_DIR"
        cd "$HERMES_DIR"
        git fetch --depth 1 https://github.com/facebook/hermes.git "$HERMES_REF"
        git checkout FETCH_HEAD
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        ninja -C build hermesvm jsi
