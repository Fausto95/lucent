name: CI

on:
  push:
    branches: [main, cpp-jsi]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Hermes revision the e2e and app-check harnesses are verified against.
  HERMES_REF: 7508017ae267ecffe4c4df38656713034f35d9bf
  HERMES_DIR: ${{ github.workspace }}/.hermes

jobs:
  test:
    name: Runtime, e2e, diagnostics, app check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libicu-dev

      - name: Restore Hermes build
        id: hermes-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HERMES_DIR }}
          key: hermes-${{ runner.os }}-${{ env.HERMES_REF }}
      - name: Build Hermes
        if: steps.hermes-cache.outputs.cache-hit != 'true'
        run: |
          git init "$HERMES_DIR"
          cd "$HERMES_DIR"
          git fetch --depth 1 https://github.com/facebook/hermes.git "$HERMES_REF"
          git checkout FETCH_HEAD
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build hermesvm jsi

      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
      - run: pnpm typecheck
      - run: pnpm test
      - name: Runtime unit tests
        run: packages/runtime/test/run.sh
      - name: Runtime unit tests (ASan/UBSan, GCC)
        run: SANITIZE=1 CXX=g++ packages/runtime/test/run.sh
      - name: End-to-end (native vs. JavaScript)
        run: pnpm test:e2e
      - name: Performance budgets (kernels vs. the same code as JavaScript)
        run: pnpm exec tsx scripts/bench.ts --check
      - name: App check (bare)
        run: pnpm exec tsx scripts/app-check.ts apps/bare-example
      - name: App check (Expo)
        run: pnpm exec tsx scripts/app-check.ts apps/expo-example
      - name: Fresh install from the packed packages
        run: pnpm exec tsx scripts/smoke-install.ts

  website:
    name: Website (samples compile, generated files current, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every Lucent sample compiles; generated C++ and diagnostics are current
        run: pnpm exec tsx scripts/website.ts --check
      - run: pnpm --filter @lucent-lang/website typecheck
      - run: pnpm website:build

  ios:
    name: Bare example (iOS simulator build)
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/bare-example
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
      - name: Compiler and bindgen tests with the iOS SDK (the Linux job skips them)
        run: pnpm test
      - name: SDK coverage (fails when a module's unrepresentable share grows past sdk-coverage.json)
        run: node packages/lucent/bin/lucent.cjs sdk coverage --ios UIKit,Foundation,AVFoundation --android 'android.*' --json --check sdk-coverage.json > sdk-coverage.current.json
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-coverage
          path: sdk-coverage.current.json
      - name: Runtime unit tests (ASan/UBSan, libc++)
        run: SANITIZE=1 packages/runtime/test/run.sh
      - name: Generate the native package
        working-directory: apps/bare-example
        run: pnpm lucent
      - name: Install pods
        working-directory: apps/bare-example/ios
        run: bundle exec pod install
      - name: Build
        working-directory: apps/bare-example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace BareExample.xcworkspace -scheme BareExample \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 200

  android:
    name: Bare example (Android build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate the native package
        working-directory: apps/bare-example
        run: pnpm lucent
      - name: Build
        working-directory: apps/bare-example/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
