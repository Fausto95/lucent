name: CI

on:
  push:
    branches: [main, cpp-jsi]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Hermes revision the e2e and app-check harnesses are verified against.
  HERMES_REF: 7508017ae267ecffe4c4df38656713034f35d9bf
  HERMES_DIR: ${{ github.workspace }}/.hermes

jobs:
  # Linux jobs side by side: the unit tests (two shards), the runtime's own tests, and the
  # harnesses that run compiled code (below).
  test:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/hermes
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
          # An older cache still serves: its entries are keyed by SDK and extractor, and the ones a
          # changed extractor no longer reads are extracted again beside them.
          restore-keys: lucent-sdk-${{ runner.os }}-
      - run: pnpm typecheck
        if: matrix.shard == 1
      - run: pnpm exec vp test run --shard=${{ matrix.shard }}/2

  runtime:
    name: Runtime and JSI host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/hermes
      - uses: ./.github/actions/ccache
        with:
          key: runtime
      - name: Runtime unit tests
        run: packages/runtime/test/run.sh
      - name: Runtime unit tests (ASan/UBSan, GCC)
        run: SANITIZE=1 CXX=g++ packages/runtime/test/run.sh
      - name: JSI host lifetime and hand-written module (Hermes)
        run: packages/runtime/test/jsi/run.sh
      - name: JSI host lifetime (ASan/UBSan)
        run: SANITIZE=1 packages/runtime/test/jsi/run.sh
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  # The harnesses that run compiled code, one job each: each takes minutes.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: End-to-end (native vs. JavaScript)
            key: e2e
            run: pnpm test:e2e
          - name: Performance budgets, fresh install
            key: bench
            run: node scripts/bench.ts --check && node scripts/smoke-install.ts
          - name: App check (bare)
            key: app-check-bare
            run: node scripts/app-check.ts apps/bare-example
          - name: App check (Expo)
            key: app-check-expo
            run: node scripts/app-check.ts apps/expo-example
    steps:
      - uses: actions/checkout@v4
      # The app checks' device builds resolve the apps' Android dependencies with Gradle.
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/hermes
      - uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.key }}
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
          # An older cache still serves: its entries are keyed by SDK and extractor, and the ones a
          # changed extractor no longer reads are extracted again beside them.
          restore-keys: lucent-sdk-${{ runner.os }}-
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  website:
    name: Website (samples compile, prose rules, generated files current, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Vale
        run: curl -sSL https://github.com/errata-ai/vale/releases/download/v3.22.0/vale_3.22.0_Linux_64-bit.tar.gz | sudo tar -xz -C /usr/local/bin vale
      - name: Every Lucent sample compiles; prose follows the rules; generated C++ and diagnostics are current
        run: node scripts/website.ts --check
      - run: pnpm --filter @lucent-lang/website typecheck
      - run: pnpm website:build

  # The tests that need the iOS SDK, in four shards, beside the app build.
  ios-test:
    name: Unit tests with the iOS SDK (${{ matrix.shard }}/4)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/bare-example
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
          # An older cache still serves: its entries are keyed by SDK and extractor, and the ones a
          # changed extractor no longer reads are extracted again beside them.
          restore-keys: lucent-sdk-${{ runner.os }}-
      - name: Compiler and bindgen tests with the iOS SDK (the Linux job skips them)
        run: pnpm exec vp test run --shard=${{ matrix.shard }}/4

  # Beside the app build: SDK coverage and the runtime under libc++'s sanitizers.
  ios-checks:
    name: SDK coverage, runtime (libc++)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
          # An older cache still serves: its entries are keyed by SDK and extractor, and the ones a
          # changed extractor no longer reads are extracted again beside them.
          restore-keys: lucent-sdk-${{ runner.os }}-
      - name: SDK coverage (fails when a module's unrepresentable share grows past sdk-coverage.json)
        run: node packages/lucent/bin/lucent.cjs sdk coverage --ios UIKit,Foundation,AVFoundation,StoreKit,CryptoKit --android 'android.*' --json --check sdk-coverage.json > sdk-coverage.current.json
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-coverage
          path: sdk-coverage.current.json
      - name: Runtime unit tests (ASan/UBSan, libc++)
        run: SANITIZE=1 packages/runtime/test/run.sh

  ios:
    name: Bare example (iOS simulator build)
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # React Native's pods compile through ccache when pod install sees this.
      USE_CCACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/bare-example
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
          # An older cache still serves: its entries are keyed by SDK and extractor, and the ones a
          # changed extractor no longer reads are extracted again beside them.
          restore-keys: lucent-sdk-${{ runner.os }}-
      - uses: ./.github/actions/ccache
        with:
          key: ios
      # lucent build reads the pods' headers from the Pods xcconfig, and pod install links the
      # native package lucent build writes: a fresh checkout installs pods on each side of it.
      - name: Install pods (their headers, for lucent build)
        working-directory: apps/bare-example/ios
        run: bundle exec pod install
      # Every platform: with Android's SDK on the runner, an iOS-only build still types the Android
      # branches, whose dependencies only the Android build resolves.
      - name: Generate the native package
        working-directory: apps/bare-example
        run: pnpm lucent
      - name: Install pods (linking the native package)
        working-directory: apps/bare-example/ios
        run: bundle exec pod install
      - name: Build
        working-directory: apps/bare-example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace BareExample.xcworkspace -scheme BareExample \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 200
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  android:
    name: Bare example (Android build)
    runs-on: ubuntu-latest
    env:
      # CMake compiles the native code through ccache (CMake reads these from the environment).
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup
      - name: SDK binding cache (schemas extracted on demand, keyed by SDK and extractor)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucent
          key: lucent-sdk-${{ runner.os }}-${{ hashFiles('packages/bindgen/src/**') }}
          # An older cache still serves: its entries are keyed by SDK and extractor, and the ones a
          # changed extractor no longer reads are extracted again beside them.
          restore-keys: lucent-sdk-${{ runner.os }}-
      - uses: ./.github/actions/ccache
        with:
          key: android
      - name: Generate the native package, for Android (the app this job builds)
        working-directory: apps/bare-example
        run: pnpm lucent --platforms android
      - name: Build
        working-directory: apps/bare-example/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --build-cache --parallel
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
