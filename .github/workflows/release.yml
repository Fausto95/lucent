name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, tag, publish
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from main, not ${GITHUB_REF#refs/heads/}"
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes an npm userconfig that reads NODE_AUTH_TOKEN; pnpm publish honours it.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(pnpm exec tsx scripts/bump-version.ts "$BUMP")" >> "$GITHUB_OUTPUT"

      # Same gate as ci.yml, run against the bumped tree. Pushes made with
      # GITHUB_TOKEN never trigger ci.yml, so this is the only check the
      # release commit gets.
      - run: pnpm typecheck
      - run: pnpm test
      - run: packages/runtime/test/run.sh
      - name: Fresh install from the packed packages
        run: pnpm exec tsx scripts/smoke-install.ts

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin main "refs/tags/v$VERSION"

      # Pushed before publishing on purpose: if publishing fails part-way, a
      # re-run bumps to a fresh version instead of colliding with the subset
      # already on npm.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish -r --no-git-checks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
