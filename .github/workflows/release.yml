name: Release

# Changesets drive releases. On main, pending changesets (.changeset/*.md)
# open or update a "Version packages" PR that bumps @lucent-lang/lucent and
# writes its CHANGELOG.md. Merging that PR publishes the new version to npm
# with provenance, tags it and creates the GitHub release.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the version commit, tags and GitHub releases
  pull-requests: write # the "Version packages" PR
  id-token: write # npm provenance

jobs:
  # The runtime's core prebuilt for iOS (scripts/prebuilt-runtime.ts), which only macOS can
  # build; the release job adds Android's and packs both into @lucent-lang/lucent.
  prebuilt-ios:
    name: Prebuilt runtime (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - run: node scripts/prebuilt-runtime.ts ios
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-ios
          path: packages/runtime/prebuilt

  release:
    name: Version or publish
    needs: prebuilt-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog links each entry to the commit that added its changeset.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          # Writes an npm userconfig that reads NODE_AUTH_TOKEN; pnpm publish honours it.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The prebuilt runtime: iOS's from its job, then each Android ABI with the runner's NDK
      # ($ANDROID_NDK_HOME), into packages/runtime/prebuilt, which the package build copies.
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-ios
          path: packages/runtime/prebuilt
      - run: node scripts/prebuilt-runtime.ts android
      - run: pnpm build

      # The gate before a version PR is opened or a release published. Commits
      # the action pushes with GITHUB_TOKEN never trigger ci.yml, so the
      # version PR gets no other check.
      - run: pnpm check
      - run: pnpm test
      - run: packages/runtime/test/run.sh
      - name: Fresh install from the packed packages
        run: node scripts/smoke-install.ts

      # v2 is the action for Changesets v3: it learns what was published from
      # the CLI's output file (CHANGESETS_OUTPUT), where v1 parsed stdout that
      # v3 no longer prints, and so pushed no tag and created no release.
      - uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          # An app installs @lucent-lang/lucent; everything else is bundled into it.
          publish-script: pnpm run release
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
