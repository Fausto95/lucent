name: Window apps

# Fresh apps on each release Lucent supports (decisions 0074 and 0079): bare apps from React
# Native's template for each release of the window, Expo apps from create-expo-app's for each SDK,
# with the packed package, a module of each kind and a component, built in Release for the iOS
# simulator and Android, then run there: the app calls the modules, mounts the components and logs
# its verdict, which scripts/device-check.ts reads (scripts/window-app.ts). ci.yml calls it
# nightly; it can be run by hand too.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every run step sources this: a failing step's output becomes an error annotation.
  BASH_ENV: ${{ github.workspace }}/scripts/ci-trap.sh
  # As in ci.yml: a called workflow has its own env.
  XCODE_VERSION: "26.6"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  DEVICE_CHECK_OUT: ${{ github.workspace }}/device-check

jobs:
  apps:
    name: The window's apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: apps
        run: echo "apps=$(node scripts/window-app.ts --matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: apps
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.platform == 'android'
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/sdk-cache
        with:
          key: window-${{ matrix.platform }}
      - name: Make and build the app
        timeout-minutes: 50
        run: |
          set -o pipefail
          node scripts/window-app.ts --app ${{ matrix.app }} --release ${{ matrix.release }} \
            --platform ${{ matrix.platform }} --dir "$RUNNER_TEMP/app" 2>&1 | tee window-app.log
      - name: Run the app on the simulator
        if: matrix.platform == 'ios'
        timeout-minutes: 20
        run: |
          node scripts/window-app.ts --app ${{ matrix.app }} --release ${{ matrix.release }} \
            --platform ios --dir "$RUNNER_TEMP/app" --check
      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on the emulator
        if: matrix.platform == 'android'
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node scripts/window-app.ts --app ${{ matrix.app }} --release ${{ matrix.release }} --platform android --dir "$RUNNER_TEMP/app" --check
      - name: Keep the logs and the screen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-${{ matrix.app }}-${{ matrix.release }}-${{ matrix.platform }}
          path: |
            window-app.log
            device-check/
          if-no-files-found: ignore
