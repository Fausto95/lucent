name: SDK prebuilt caches

# Schemas for EVERY framework of the iOS SDK and every package of android.jar,
# for machines without a local SDK (editors, Linux CI). Nothing is listed:
# scripts/prebuild-sdk.ts binds what the installed SDKs contain. The release
# workflow publishes them as @lucent-lang/sdk-ios and @lucent-lang/sdk-android.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  prebuild:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract every module of both SDKs
        run: pnpm exec tsx scripts/prebuild-sdk.ts ios android
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-prebuilt
          path: |
            packages/sdk-ios/*.json
            packages/sdk-android/*.json
            !packages/sdk-*/package.json
