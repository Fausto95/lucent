name: Changeset

# @lucent-lang/lucent bundles every package under packages/, so a change
# there reaches users and needs a changeset for it. Docs- or test-only
# changes opt out with the no-changeset label.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset for changes under packages/
    # The version PR removes changesets rather than adding one.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A changeset comes with changes under packages/
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$(git diff --name-only "$BASE"...HEAD -- packages/)" ]; then
            echo "Nothing under packages/ changed."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '.changeset/*.md')
          if [ -z "$added" ]; then
            echo "::error::This PR changes packages/ without a changeset. Run \`pnpm changeset\` and commit the file it writes, or label the PR no-changeset if users see no change (docs, tests)."
            exit 1
          fi
          echo "Changesets: $added"
          # Under 0.x a breaking change is a minor, not a major (CONTRIBUTING.md, Changesets).
          for f in $added; do
            if grep -Eq '^"?@lucent-lang/lucent"?: *major' "$f"; then
              echo "::error file=$f::Lucent is 0.x: a breaking change is a minor bump (0.2 to 0.3), not a major one. Change \"major\" to \"minor\" and say what breaks in the summary."
              exit 1
            fi
          done
